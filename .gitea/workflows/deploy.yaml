name: Rust Axum CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY_HOST: gitea.shahiapp.ir # REPLACE THIS
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build_and_push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Gitea Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: crates/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy to Server
    needs: build_and_push
    runs-on: ubuntu-latest

    container:
      image: catthehacker/ubuntu:act-latest
      
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 9011
          script: |
            echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ env.REGISTRY_HOST }} -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin
            
            docker pull ${{ env.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:latest
            
            docker stop ai-form-builder-rust || true
            docker rm ai-form-builder-rust || true
            
            docker run -d \
              --name ai-form-builder-rust \
              --restart always \
              -p 5000:3000 \
              ${{ env.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:latest
              

