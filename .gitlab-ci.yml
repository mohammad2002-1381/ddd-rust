variables:
  DOCKER_HOST: tcp://docker:2375
  # This disables TLS (required since your runner config has tls_verify = false)
  DOCKER_TLS_CERTDIR: ""

stages:
  - build
  - deploy

build-image:
  stage: build
  image: docker:24.0.7
  services:
    - docker:24.0.7-dind
  tags:
    - docker
  before_script:
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASS registry.gitlab.com
  script:
    - docker build -t $IMAGE_NAME -f crates/api/Dockerfile .
    - docker push $IMAGE_NAME
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

deploy-global:
  stage: deploy
  needs:
    - build-image
  tags:
    - docker
  before_script:
    - chmod 400 "$SSH_KEY"
  script:
    - >
      ssh -o StrictHostKeyChecking=no -i $SSH_KEY $SERVER "
      docker login -u $REGISTRY_USER -p $REGISTRY_PASS registry.gitlab.com &&

      docker pull $IMAGE_NAME &&
      docker network create nginxnet || true &&
      docker stop abarai-backend-rust || true &&
      docker rm abarai-backend-rust || true &&

      docker run -d --restart=always
      --name abarai-backend-rust
      --network nginxnet
      --network backend
      -p 5000:5000
      $IMAGE_NAME
      "
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    