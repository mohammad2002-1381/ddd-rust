[package]
name = "application"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.49.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
sea-orm = { version = "1.1.19" }
axum = "0.8.9"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
dotenvy = "0.15.7"
argon2 = "0.5.3"
hex = "0.4.3"
rand = "0.8"
serde_json = "1.0.149"
thiserror = "2.0.18"
redis = { version = "1.3.0", features = ["tokio-comp"] }

infrastructure = { path = "../infrastructure" }
domain = { path = "../domain" }
query_handler = { path = "../query_handler" }
read_model = { path = "../read_model" }

